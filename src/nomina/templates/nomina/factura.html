<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Nómina Pyme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .dash-card { border: none; border-radius: 6px; color: white; padding: 20px; transition: transform 0.2s; text-decoration: none; display: flex; align-items: center; }
        .dash-card:hover { transform: translateY(-3px); color: white; opacity: 0.95; }
        .dash-icon { font-size: 2.5rem; margin-right: 15px; }
        .bg-config { background-color: #3182ce; }
        .bg-usuarios { background-color: #dd6b20; }
        .bg-empleados { background-color: #38a169; }
        .bg-nomina { background-color: #319795; }
    </style>
</head>
<body>

    <div class="container my-4">
        <h4 class="text-secondary mb-3"><i class="bi bi-display me-2"></i>Panel de Control</h4>
        <div class="row g-3 mb-4">
            <!-- 1. CONFIGURACIÓN -->
            <div class="col-md-6 col-lg-3">
                <a href="/api/empleados/" target="_blank" class="dash-card bg-config shadow-sm">
                    <i class="bi bi-code-slash dash-icon"></i>
                    <div><h5 class="mb-0 fw-bold">Configuración</h5><small>API REST Endpoints</small></div>
                </a>
            </div>
            <!-- 2. USUARIOS -->
            <div class="col-md-6 col-lg-3">
                <a href="/admin/auth/user/" class="dash-card bg-usuarios shadow-sm">
                    <i class="bi bi-person-fill dash-icon"></i>
                    <div><h5 class="mb-0 fw-bold">Usuarios</h5><small>Usuarios del sistema</small></div>
                </a>
            </div>
            <!-- 3. EMPLEADOS -->
            <div class="col-md-6 col-lg-3">
                <a href="/admin/colaboradores/empleado/" class="dash-card bg-empleados shadow-sm">
                    <i class="bi bi-people-fill dash-icon"></i>
                    <div><h5 class="mb-0 fw-bold">Empleados</h5><small>Listado de colaboradores</small></div>
                </a>
            </div>
            <!-- 4. NÓMINA -> REDIRECCIONA AL MÓDULO -->
            <div class="col-md-6 col-lg-3">
                <a href="/nomina-gestion/" class="dash-card bg-nomina shadow-sm">
                    <i class="bi bi-cash-stack dash-icon"></i>
                    <div><h5 class="mb-0 fw-bold">Nómina</h5><small>Generar desprendible de pago</small></div>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
