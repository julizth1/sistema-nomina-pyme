<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Comprobantes de Nómina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <h2 class="mb-4">Generación de Comprobantes de Pago</h2>
    <div class="card p-4 shadow-sm">
        <form id="form-nomina" method="POST" action="/api/generar-factura/">
            <div class="mb-3">
                <label class="form-label">Empleado</label>
                <select name="empleado_id" class="form-select" required>
                    <option value="1">Sergio Elías Vergara Castillo (C.C. 1.003.044.253)</option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Sueldo Básico</label>
                    <input type="number" name="sueldo_basico" class="form-control" value="1751000" readonly>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Horas Recargos Nocturnas</label>
                    <input type="number" step="0.5" id="horas_nocturnas" class="form-control" value="16.0">
                </div>
            </div>
            <button type="button" onclick="calcularNominaJS()" class="btn btn-primary">Calcular y Vista Previa</button>
        </form>
    </div>

    <div id="resultado" class="card p-4 shadow-sm mt-4 d-none">
        <h4>Resumen de Desprendible</h4>
        <p><strong>Total Devengado:</strong> $<span id="lbl-devengado"></span></p>
        <p><strong>Total Deducciones:</strong> $<span id="lbl-deducciones"></span></p>
        <p><strong>Neto a Recibir:</strong> $<span id="lbl-neto"></span></p>
    </div>
</div>

<script>
function calcularNominaJS() {
    const sueldoBase = 1751000;
    const dias = 15;
    const devengadoSueldo = (sueldoBase / 30) * dias;
    const auxTransporte = (249095 / 30) * dias;
    
    const horasNocturnas = parseFloat(document.getElementById('horas_nocturnas').value) || 0;
    const valorHoraOrdinaria = sueldoBase / 240;
    const recargoNocturno = (valorHoraOrdinaria * 0.35) * horasNocturnas;

    const totalDevengado = devengadoSueldo + auxTransporte + recargoNocturno;
    
    const ibc = devengadoSueldo + recargoNocturno;
    const salud = ibc * 0.04;
    const pension = ibc * 0.04;
    const totalDeducciones = salud + pension;
    
    const neto = totalDevengado - totalDeducciones;

    document.getElementById('lbl-devengado').innerText = totalDevengado.toLocaleString('es-CO');
    document.getElementById('lbl-deducciones').innerText = totalDeducciones.toLocaleString('es-CO');
    document.getElementById('lbl-neto').innerText = neto.toLocaleString('es-CO');
    document.getElementById('resultado').classList.remove('d-none');
}
</script>
</body>
</html>
